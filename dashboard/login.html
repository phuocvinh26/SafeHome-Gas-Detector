<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Safehome Multifunction Hub - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Phosphor Icons for UI accents -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800 selection:bg-blue-600 selection:text-white relative overflow-hidden">
    <!-- Ambient background glow elements -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-200/50 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-sky-200/40 rounded-full blur-3xl pointer-events-none"></div>
    <!-- Login Card Container -->
    <div
        class="w-full max-w-md bg-white border border-slate-200 shadow-xl shadow-slate-200/60 rounded-2xl p-8 relative z-10">
        <!-- Brand / Header Section -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-500 shadow-lg shadow-blue-500/25 mb-4 ring-4 ring-blue-50">
                <i class="ph-bold ph-shield-check text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-1">Safehome Multifunction Hub</h1>
            <p class="text-sm text-slate-500">Group 10</p>
        </div>
        <!-- Error Alert Box -->
        <div class="hidden mb-6 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-3 transition-all animate-shake"
            id="alertBox">
            <i class="ph-fill ph-warning-circle text-xl text-red-500 shrink-0"></i>
            <span id="alertMessage">Invalid username or password.</span>
        </div>
        <!-- Login Form -->
        <form class="space-y-5" id="loginForm" onsubmit="handleLogin(event)">
            <!-- Username Field -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2"
                    for="username">Username</label>
                <div class="relative">
                    <span
                        class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-lg">
                        <i class="ph ph-user"></i>
                    </span>
                    <input autocomplete="username"
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition-all text-sm font-medium"
                        id="username" name="username" placeholder="admin" required="" type="text" />
                </div>
            </div>
            <!-- Password Field -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700"
                        for="password">Password</label>
                </div>
                <div class="relative">
                    <span
                        class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-lg">
                        <i class="ph ph-lock-key"></i>
                    </span>
                    <input autocomplete="current-password"
                        class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition-all text-sm font-medium"
                        id="password" name="password" placeholder="•••" required="" type="password" />
                    <button
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                        onclick="togglePasswordVisibility()" title="Toggle password view" type="button">
                        <i class="ph ph-eye text-lg" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            <!-- Submit Button -->
            <button
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2"
                id="submitBtn" type="submit">
                <span>Sign In</span>
                <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>

    </div>
    <!-- Login Logic Script -->
    <script>
        // Password toggle
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        // Form submission & authentication
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            const submitBtn = document.getElementById('submitBtn');

            // Credentials verification
            if (usernameInput === 'admin' && passwordInput === 'admin10') {
                alertBox.classList.add('hidden');

                // Visual feedback
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Authenticating...</span>
        `;

                // Store simple auth flag for seamless user experience
                sessionStorage.setItem('safehome_auth', 'true');
                sessionStorage.setItem('safehome_user', usernameInput);

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } else {
                alertMessage.textContent = 'Invalid credentials. Please try again.';
                alertBox.classList.remove('hidden');

                // Visual shake animation effect
                alertBox.classList.remove('animate-shake');
                void alertBox.offsetWidth; // trigger reflow
                alertBox.classList.add('animate-shake');
            }
        }     
    </script>
</body>

</html>
